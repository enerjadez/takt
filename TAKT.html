  --muted: #8a8a99;
  --faint: #5c5c6b;
  --accent: #ff2d6a;
  --accent-dim: rgba(255, 45, 106, 0.16);
  --mint: #3dffc4;
  --mint-dim: rgba(61, 255, 196, 0.14);
  --blue: #6b8cff;
  --gold: #ffc857;
  --voice: #ffb020;
  --pink: #e879f9;
  --danger: #ff4d4d;
  --ok: #3dffc4;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  --radius: 16px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --font: "Manrope", "Segoe UI", Roboto, system-ui, sans-serif;
  --display: "Syne", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
.hidden-file { position: fixed; left: -9999px; width: 1px; height: 1px; opacity: 0; }
#app { height: 100%; }

/* ——— home ——— */
.home {
  min-height: 100%;
  overflow: auto;
  padding: calc(28px + var(--safe-t)) 28px calc(40px + var(--safe-b));
  background:
    radial-gradient(900px 420px at 10% -10%, rgba(255, 45, 106, 0.18), transparent 55%),
    radial-gradient(700px 380px at 110% 0%, rgba(61, 255, 196, 0.1), transparent 50%),
    var(--bg);
}
.home-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand img { width: 56px; height: 56px; border-radius: 16px; box-shadow: var(--shadow); }
.brand h1 { font-family: var(--display); font-size: 40px; margin: 0; letter-spacing: -0.04em; line-height: 1; }
.brand p { margin: 6px 0 0; color: var(--muted); font-size: 14px; letter-spacing: 0.04em; }
.home-actions { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; margin-bottom: 36px; }
.hero-card, .action-card {
  border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015));
  border-radius: 22px;
  padding: 22px;
  text-align: left;
  min-height: 132px;
  display: flex; flex-direction: column; justify-content: space-between;
  transition: transform .15s ease, border-color .15s;
}
.hero-card { background: linear-gradient(145deg, #ff2d6a 0%, #c2185b 55%, #1a0a12 140%); border-color: transparent; }
.hero-card:active, .action-card:active { transform: scale(0.985); }
.hero-card .kicker, .action-card .kicker { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.75; }
.hero-card h2, .action-card h2 { margin: 10px 0 0; font-family: var(--display); font-size: 26px; letter-spacing: -0.03em; }
.action-card.mint { border-color: rgba(61,255,196,0.25); }
.section-h { display: flex; align-items: baseline; justify-content: space-between; margin: 8px 0 14px; }
.section-h h3 { margin: 0; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.recents { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
.recent {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  overflow: hidden;
  text-align: left;
}
.recent .thumb {
  aspect-ratio: 9/14;
  background: #0a0a0e center/cover no-repeat;
  position: relative;
}
.recent .thumb.empty { display: grid; place-items: center; color: var(--faint); font-size: 28px; }
.recent .meta { padding: 10px 12px 12px; }
.recent .meta b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent .meta span { color: var(--muted); font-size: 12px; }
.empty-recents { color: var(--muted); padding: 28px 8px; }

/* ——— editor shell ——— */
.editor {
  height: 100%;
  display: grid;
  grid-template-areas:
    "top"
    "stage"
    "trans"
    "tl"
    "dock";
  grid-template-rows: auto 1fr auto auto auto;
  padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
  background: var(--bg);
}
.topbar { grid-area: top; }
.workspace { grid-area: stage; min-height: 0; }
.transport { grid-area: trans; }
.timeline { grid-area: tl; }
.dock { grid-area: dock; }
.side { display: contents; }
.topbar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
}
.topbar .name {
  flex: 1; min-width: 0;
  background: transparent; border: 0;
  font-family: var(--display); font-weight: 700; font-size: 16px;
  letter-spacing: -0.02em;
}
.icon-btn, .text-btn {
  min-width: 40px; height: 40px; padding: 0 12px;
  border-radius: 12px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  color: var(--text); background: var(--surface);
  border: 1px solid var(--line);
  font-weight: 600; font-size: 13px;
}
.icon-btn:disabled, .text-btn:disabled { opacity: 0.35; }
.icon-btn.ghost, .text-btn.ghost { background: transparent; }
.icon-btn.warn { color: var(--accent); }
.text-btn.accent { background: var(--accent); border-color: transparent; color: white; }
.workspace {
  display: grid;
  grid-template-columns: 1fr;
}
.stage-wrap {
  min-height: 0;
  display: grid;
  place-items: center;
  padding: 10px 12px 4px;
  background:
    linear-gradient(var(--line), var(--line)) 0 0/20px 1px,
    linear-gradient(var(--line), var(--line)) 0 0/1px 20px,
    #08080c;
}
.stage {
  position: relative;
  max-width: 100%;
  max-height: 100%;
  background: #000;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 0 0 1px var(--line2), var(--shadow);
}
.stage canvas { display: block; width: 100%; height: 100%; }
.stage video.pool { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }
.stage-hud {
  position: absolute; left: 10px; top: 10px;
  font-variant-numeric: tabular-nums;
  font-size: 12px; color: #fff;
  background: rgba(0,0,0,0.45);
  border-radius: 8px; padding: 4px 8px;
  backdrop-filter: blur(8px);
}
.transport {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
}
.play-btn {
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--text); color: #111;
  display: grid; place-items: center; font-size: 18px;
}
.time-read { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); min-width: 118px; }
.transport .grow { flex: 1; }

/* timeline */
.timeline {
  height: 168px;
  background: #0a0a0e;
  border-top: 1px solid var(--line);
  position: relative;
  overflow: hidden;
  touch-action: pan-x;
  user-select: none;
}
.tl-scroll {
  position: absolute; inset: 0;
  overflow-x: auto; overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
}
.tl-inner { position: relative; height: 100%; }
.tl-ruler {
  height: 22px; position: relative;
  color: var(--faint); font-size: 10px;
  border-bottom: 1px solid var(--line);
}
.tl-tick { position: absolute; top: 4px; transform: translateX(-50%); pointer-events: none; }
.tl-track {
  position: relative; height: 44px;
  margin: 4px 0 0;
  background: rgba(255,255,255,0.015);
}
.tl-track.label::before {
  content: attr(data-label);
  position: absolute; left: 6px; top: 2px;
  font-size: 9px; letter-spacing: 0.12em; color: var(--faint); z-index: 2;
}
.tl-clip {
  position: absolute; top: 6px; height: 34px;
  border-radius: 8px; overflow: hidden;
  border: 1px solid rgba(255,255,255,0.12);
  display: flex; align-items: center;
  color: #fff; font-size: 11px; font-weight: 600;
  padding: 0 8px;
  background: #3553b8;
  white-space: nowrap;
}
.tl-clip.video { background: linear-gradient(90deg, #3553b8, #4c6fff); }
.tl-clip.image { background: linear-gradient(90deg, #5b3bb8, #7a5cff); }
.tl-clip.music { background: linear-gradient(90deg, #0f7a5d, #1fd9a0); top: 8px; }
.tl-clip.voice { background: linear-gradient(90deg, #a36b00, #ffb020); top: 8px; }
.tl-clip.overlay { background: linear-gradient(90deg, #8a2bb8, #e879f9); top: 8px; }
.tl-clip.selected { outline: 2px solid #fff; outline-offset: 0; z-index: 3; }
.tl-clip .handle {
  position: absolute; top: 0; width: 10px; height: 100%;
  background: rgba(255,255,255,0.25);
}
.tl-clip .handle.l { left: 0; }
.tl-clip .handle.r { right: 0; }
.tl-beats { position: absolute; inset: 22px 0 0; pointer-events: none; }
.tl-beat { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(61,255,196,0.28); }
.tl-playhead {
  position: absolute; top: 0; bottom: 0; width: 2px;
  background: var(--accent); z-index: 5; pointer-events: none;
}
.tl-playhead::before {
  content: "";
  position: absolute; top: 0; left: -5px;
  border-left: 6px solid transparent; border-right: 6px solid transparent;
  border-top: 8px solid var(--accent);
}

/* dock */
.dock {
  display: flex; gap: 6px;
  padding: 8px 10px 10px;
  overflow-x: auto;
  border-top: 1px solid var(--line);
  background: var(--bg2);
}
.dock-item {
  flex: 0 0 auto;
  min-width: 68px;
  height: 58px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  font-size: 11px; font-weight: 600; color: var(--text);
}
.dock-item .ic { font-size: 18px; line-height: 1; }
.dock-item.on { border-color: var(--accent); background: var(--accent-dim); color: #fff; }

/* sheets */
.sheet-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 20;
}
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0;
  max-height: min(78vh, 720px);
  background: #121218;
  border-top: 1px solid var(--line2);
  border-radius: 22px 22px 0 0;
  z-index: 21;
  display: flex; flex-direction: column;
  padding-bottom: var(--safe-b);
  box-shadow: var(--shadow);
}
.sheet-h {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px 10px;
}
.sheet-h h3 { margin: 0; flex: 1; font-family: var(--display); letter-spacing: -0.03em; }
.sheet-body { overflow: auto; padding: 4px 16px 20px; flex: 1; }
.search {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 12px;
}
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; }
.chip {
  flex: 0 0 auto;
  padding: 8px 12px;
  border-radius: 999px;
  background: var(--surface2);
  border: 1px solid var(--line);
  font-size: 12px; font-weight: 600;
}
.chip.on { background: var(--mint); color: #06231a; border-color: transparent; }

.sound-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.sound {
  display: grid;
  grid-template-columns: 56px 1fr auto;
  gap: 10px; align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 10px;
  text-align: left;
}
.cover {
  width: 56px; height: 56px; border-radius: 12px;
  display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; color: #06140f;
}
.sound b { display: block; font-size: 14px; }
.sound span { color: var(--muted); font-size: 12px; }
.use-btn {
  background: var(--mint); color: #06231a;
  border-radius: 999px; padding: 8px 12px;
  font-weight: 800; font-size: 12px;
}
.preview-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,0.08);
}

.filter-grid, .style-grid, .sticker-grid, .ratio-grid, .trans-grid {
  display: grid; gap: 10px;
}
.filter-grid { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
.style-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
.sticker-grid { grid-template-columns: repeat(8, 1fr); }
.ratio-grid { grid-template-columns: repeat(3, 1fr); }
.trans-grid { grid-template-columns: repeat(4, 1fr); }
.filter-card, .style-card, .ratio-card, .trans-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 8px;
  min-height: 72px;
  font-size: 12px; font-weight: 700;
}
.filter-card.on, .style-card.on, .ratio-card.on, .trans-card.on {
  border-color: var(--accent); background: var(--accent-dim);
}
.sticker-grid button { font-size: 28px; height: 52px; border-radius: 12px; background: var(--surface); }

.slider-row { display: grid; grid-template-columns: 88px 1fr 44px; gap: 8px; align-items: center; margin: 10px 0; }
.slider-row input[type=range] { width: 100%; accent-color: var(--accent); }
.slider-row span { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

.row-btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.pill {
  padding: 10px 14px; border-radius: 999px;
  background: var(--surface2); border: 1px solid var(--line);
  font-weight: 700; font-size: 13px;
}
.pill.on { background: #fff; color: #111; border-color: transparent; }
.pill.danger { color: var(--danger); }

.field {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  margin: 8px 0 12px;
}
textarea.field { min-height: 88px; resize: vertical; }

.export-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 12px;
}
.progress {
  height: 8px; border-radius: 99px; background: #2a2a36; overflow: hidden; margin-top: 10px;
}
.progress > i { display: block; height: 100%; background: var(--mint); width: 0; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + var(--safe-b));
  transform: translateX(-50%);
  background: #fff; color: #111;
  padding: 10px 16px; border-radius: 999px;
  font-weight: 700; font-size: 13px;
  z-index: 40; box-shadow: var(--shadow);
}

.modal {
  position: fixed; inset: 0; z-index: 30;
  background: #050506;
  display: flex; flex-direction: column;
}
.modal video, .modal canvas { flex: 1; width: 100%; object-fit: contain; background: #000; }
.modal-bar { display: flex; gap: 8px; padding: 12px; }

@media (orientation: landscape) and (min-width: 900px) {
  .editor {
    grid-template-areas:
      "top top"
      "stage side"
      "tl tl";
    grid-template-rows: auto 1fr auto;
    grid-template-columns: minmax(300px, 44vw) 1fr;
  }
  .side {
    display: flex; flex-direction: column;
    grid-area: side; min-height: 0;
  }
  .transport, .dock { grid-area: unset; }
  .transport { padding-top: 12px; }
  .timeline { height: 186px; }
  .dock { flex-wrap: wrap; align-content: start; border-top: 0; overflow: auto; flex: 1; }
  .home-actions { grid-template-columns: 1.6fr 1fr 1fr; }
}

@media (max-width: 700px) {
  .home-actions { grid-template-columns: 1fr; }
  .sticker-grid { grid-template-columns: repeat(6, 1fr); }
}

  </style>
</head>

/* ---- db.js ---- */

const DB_NAME = "takt";
const DB_VER = 1;

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("projects")) db.createObjectStore("projects", { keyPath: "id" });
      if (!db.objectStoreNames.contains("media")) db.createObjectStore("media", { keyPath: "id" });
      if (!db.objectStoreNames.contains("prefs")) db.createObjectStore("prefs", { keyPath: "k" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

class MemoryDB {
  constructor() {
    this.projects = new Map();
    this.media = new Map();
    this.prefs = new Map();
    try {
      const raw = localStorage.getItem("takt-projects");
      if (raw) for (const p of JSON.parse(raw)) this.projects.set(p.id, p);
    } catch {}
  }
  persist() {
    try {
      localStorage.setItem("takt-projects", JSON.stringify([...this.projects.values()]));
    } catch {}
  }
}

class DB {
  constructor() {
    this.db = null;
    this.mem = null;
  }

  async init() {
    try {
      this.db = await openDb();
    } catch {
      this.mem = new MemoryDB();
    }
  }

  tx(store, mode = "readonly") {
    return this.db.transaction(store, mode).objectStore(store);
  }

  _req(req) {
    return new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  putProject(p) {
    if (this.mem) {
      this.mem.projects.set(p.id, p);
      this.mem.persist();
      return p;
    }
    return this._req(this.tx("projects", "readwrite").put(p));
  }

  getProject(id) {
    if (this.mem) return this.mem.projects.get(id);
    return this._req(this.tx("projects").get(id));
  }

  async listProjects() {
    if (this.mem) {
      return [...this.mem.projects.values()].sort((a, b) => (b.updated || 0) - (a.updated || 0));
    }
    const all = await this._req(this.tx("projects").getAll());
    return (all || []).sort((a, b) => (b.updated || 0) - (a.updated || 0));
  }

  deleteProject(id) {
    if (this.mem) {
      this.mem.projects.delete(id);
      this.mem.persist();
      return;
    }
    return this._req(this.tx("projects", "readwrite").delete(id));
  }

  putMedia(rec) {
    if (this.mem) {
      this.mem.media.set(rec.id, rec);
      return rec;
    }
    return this._req(this.tx("media", "readwrite").put(rec));
  }

  getMedia(id) {
    if (this.mem) return this.mem.media.get(id);
    return this._req(this.tx("media").get(id));
  }

  deleteMedia(id) {
    if (this.mem) {
      this.mem.media.delete(id);
      return;
    }
    return this._req(this.tx("media", "readwrite").delete(id));
  }

  getPref(k) {
    if (this.mem) return this.mem.prefs.get(k);
    return this._req(this.tx("prefs").get(k));
  }

  setPref(k, v) {
    if (this.mem) {
      this.mem.prefs.set(k, { k, v });
      return;
    }
    return this._req(this.tx("prefs", "readwrite").put({ k, v }));
  }
}

const RATIOS = {
  "9:16": [1080, 1920],
  "1:1": [1080, 1080],
  "16:9": [1920, 1080],
  "4:5": [1080, 1350],
  "4:3": [1440, 1080],
  "3:4": [1080, 1440],
};

function uid(prefix = "") {
  return prefix + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}

function clipLen(c) {
  return Math.max(0.05, (c.outPoint - c.inPoint) / (c.speed || 1));
}

function clipEnd(c) {
  return c.start + clipLen(c);
}

function projectDuration(p) {
  let m = 0;
  for (const c of p.clips) m = Math.max(m, clipEnd(c));
  for (const a of p.music) m = Math.max(m, a.start + a.duration);
  for (const a of p.voice) m = Math.max(m, a.start + a.duration);
  for (const o of p.overlays) m = Math.max(m, o.start + o.duration);
  return Math.max(m, 1);
}

function newProject(name = "Untitled") {
  return {
    id: uid("p_"),
    name,
    created: Date.now(),
    updated: Date.now(),
    ratio: "9:16",
    fps: 30,
    clips: [],
    music: [],
    voice: [],
    overlays: [],
    duckOriginal: 0.22,
    snapBeats: true,
    bg: "#000000",
  };
}

function newClip(media, start, extra = {}) {
  const dur = media.duration || 3;
  return {
    id: uid("c_"),
    mediaId: media.id,
    type: media.type,
    name: media.name || "Clip",
    start,
    inPoint: 0,
    outPoint: dur,
    speed: 1,
    volume: 1,
    muted: media.type === "image",
    reverse: false,
    transform: { x: 0, y: 0, scale: 1, rotate: 0, flipH: false, flipV: false },
    filter: "none",
    adjust: { brightness: 0, contrast: 0, saturate: 0, warmth: 0, vignette: 0, fade: 0, grain: 0 },
    transitionIn: { type: "none", duration: 0.35 },
    ...extra,
  };
}

function newAudioItem(kind, start, duration, extra = {}) {
  return {
    id: uid(kind === "music" ? "m_" : "v_"),
    kind,
    start,
    duration,
    inPoint: 0,
    volume: kind === "music" ? 0.85 : 1,
    fadeIn: 0.05,
    fadeOut: 0.2,
    loop: false,
    ...extra,
  };
}

function newOverlay(start, extra = {}) {
  return {
    id: uid("o_"),
    type: extra.type || "text",
    start,
    duration: 3,
    text: extra.text || "Your text",
    emoji: extra.emoji || "",
    x: 0.5,
    y: extra.type === "sticker" ? 0.42 : 0.78,
    scale: extra.type === "sticker" ? 1.4 : 1,
    rotate: 0,
    style: extra.style || "classic",
    ...extra,
  };
}

function clone(v) {
  return JSON.parse(JSON.stringify(v));
}

class Store {
  constructor() {
    this.project = null;
    this.time = 0;
    this.playing = false;
    this.pxPerSec = 64;
    this.tool = null;
    this.selected = { clips: [], music: [], voice: [], overlays: [] };
    this.beats = [];
    this.history = [];
    this.future = [];
    this.listeners = new Set();
  }

  on(fn) {
    this.listeners.add(fn);
    return () => this.listeners.delete(fn);
  }

  emit(why = "change") {
    for (const fn of this.listeners) fn(why, this);
  }

  load(project) {
    this.project = project;
    this.time = 0;
    this.playing = false;
    this.selected = { clips: [], music: [], voice: [], overlays: [] };
    this.history = [];
    this.future = [];
    this.beats = [];
    this.emit("load");
  }

  snapshot() {
    if (!this.project) return;
    this.history.push(clone(this.project));
    if (this.history.length > 60) this.history.shift();
    this.future = [];
  }

  undo() {
    if (!this.history.length) return;
    this.future.push(clone(this.project));
    this.project = this.history.pop();
    this.clearSel();
    this.emit("undo");
  }

  redo() {
    if (!this.future.length) return;
    this.history.push(clone(this.project));
    this.project = this.future.pop();
    this.clearSel();
    this.emit("redo");
  }

  clearSel() {
    this.selected = { clips: [], music: [], voice: [], overlays: [] };
  }

  select(kind, id, additive = false) {
    if (!additive) this.clearSel();
    const arr = this.selected[kind];
    if (!arr) return;
    const i = arr.indexOf(id);
    if (i >= 0) arr.splice(i, 1);
    else arr.push(id);
    this.emit("select");
  }

  selectedClip() {
    const id = this.selected.clips[0];
    return this.project?.clips.find((c) => c.id === id) || null;
  }

  selectedAudio() {
    const mid = this.selected.music[0];
    if (mid) return this.project.music.find((a) => a.id === mid) || null;
    const vid = this.selected.voice[0];
    if (vid) return this.project.voice.find((a) => a.id === vid) || null;
    return null;
  }

  selectedOverlay() {
    const id = this.selected.overlays[0];
    return this.project?.overlays.find((o) => o.id === id) || null;
  }

  setTime(t) {
    const d = this.project ? projectDuration(this.project) : 1;
    this.time = Math.max(0, Math.min(d, t));
    this.emit("time");
  }
}


/* ---- library.js ---- */

function midiHz(n) {
  return 440 * Math.pow(2, (n - 69) / 12);
}

function pat(str) {
  return str.replace(/\s+/g, "").split("").map((c) => {
    if (c === "0" || c === "." || c === "-") return 0;
    if (c === "1") return 1;
    const v = parseInt(c, 16);
    return Number.isFinite(v) ? v / 15 : 0;
  });
}

function fill(bars, notes) {
  const out = [];
  for (let b = 0; b < bars; b++) {
    for (const n of notes) out.push([b + (n[0] || 0), n[1], n[2], n[3], n[4] ?? 0.85]);
  }
  return out;
}

function noiseBuffer(ctx, seconds = 1) {
  const n = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}

function envGain(ctx, t, peak, a, d, dest) {
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  g.connect(dest);
  return g;
}

function getTrack(id) {
  return TRACKS.find((t) => t.id === id) || null;
}

function trackDuration(track) {
  return (track.bars * 4 * 60) / track.bpm;
}

function trackBeats(track) {
  const step = 60 / track.bpm;
  const beats = [];
  for (let i = 0; i < track.bars * 4; i++) beats.push(i * step);
  return beats;
}

function stepTime(track, bar, step) {
  const six = 60 / track.bpm / 4;
  let t = (bar * 16 + step) * six;
  if (track.swing && step % 2 === 1) t += six * track.swing;
  return t;
}

function hitKick(ctx, dest, t, vel) {
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(172, t);
  o.frequency.exponentialRampToValueAtTime(46, t + 0.07);
  g.gain.setValueAtTime(vel * 1.1, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
  o.connect(g);
  g.connect(dest);
  o.start(t);
  o.stop(t + 0.3);
  const click = ctx.createOscillator();
  const cg = ctx.createGain();
  click.type = "square";
  click.frequency.value = 1400;
  cg.gain.setValueAtTime(vel * 0.12, t);
  cg.gain.exponentialRampToValueAtTime(0.0001, t + 0.02);
  click.connect(cg);
  cg.connect(dest);
  click.start(t);
  click.stop(t + 0.03);
}

function hitNoise(ctx, dest, t, vel, dur, hp, peak = 1) {
  const src = ctx.createBufferSource();
  src.buffer = noiseBuffer(ctx, 1);
  const f = ctx.createBiquadFilter();
  f.type = "highpass";
  f.frequency.value = hp;
  const g = ctx.createGain();
  g.gain.setValueAtTime(vel * peak, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f);
  f.connect(g);
  g.connect(dest);
  src.start(t);
  src.stop(t + dur + 0.02);
}

function hitSnare(ctx, dest, t, vel) {
  hitNoise(ctx, dest, t, vel, 0.18, 900, 0.55);
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = "triangle";
  o.frequency.setValueAtTime(196, t);
  o.frequency.exponentialRampToValueAtTime(140, t + 0.1);
  g.gain.setValueAtTime(vel * 0.35, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
  o.connect(g);
  g.connect(dest);
  o.start(t);
  o.stop(t + 0.16);
}

function hitClap(ctx, dest, t, vel) {
  hitNoise(ctx, dest, t, vel, 0.16, 1200, 0.45);
  hitNoise(ctx, dest, t + 0.012, vel * 0.8, 0.12, 1400, 0.35);
}

function hitHat(ctx, dest, t, vel, open = false) {
  hitNoise(ctx, dest, t, vel, open ? 0.22 : 0.045, open ? 6000 : 8000, open ? 0.22 : 0.18);
}

function hitPerc(ctx, dest, t, vel) {
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(540, t);
  o.frequency.exponentialRampToValueAtTime(220, t + 0.08);
  g.gain.setValueAtTime(vel * 0.35, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  o.connect(g);
  g.connect(dest);
  o.start(t);
  o.stop(t + 0.13);
}

function playBass(ctx, dest, t, midi, dur, vel, log = false) {
  const o = ctx.createOscillator();
  const o2 = ctx.createOscillator();
  const f = ctx.createBiquadFilter();
  const g = ctx.createGain();
  o.type = log ? "sine" : "sawtooth";
  o2.type = "sine";
  const hz = midiHz(midi);
  o.frequency.setValueAtTime(hz, t);
  o2.frequency.setValueAtTime(hz * 0.5, t);
  if (log) {
    o.frequency.exponentialRampToValueAtTime(hz * 1.06, t + dur * 0.4);
    o.frequency.exponentialRampToValueAtTime(hz, t + dur);
  }
  f.type = "lowpass";
  f.frequency.setValueAtTime(log ? 900 : 280, t);
  f.Q.value = log ? 6 : 1.2;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vel * (log ? 0.7 : 0.55), t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f);
  o2.connect(g);
  f.connect(g);
  g.connect(dest);
  o.start(t);
  o2.start(t);
  o.stop(t + dur + 0.02);
  o2.stop(t + dur + 0.02);
}

function playVoice(ctx, dest, t, midi, dur, vel, kind) {
  const o = ctx.createOscillator();
  const o2 = ctx.createOscillator();
  const f = ctx.createBiquadFilter();
  const g = ctx.createGain();
  o.type = kind === "lead" ? "sawtooth" : "triangle";
  o2.type = "sine";
  const hz = midiHz(midi);
  o.frequency.value = hz;
  o2.frequency.value = hz * 1.003;
  f.type = "lowpass";
  f.frequency.setValueAtTime(kind === "pad" ? 1400 : 2800, t);
  f.frequency.exponentialRampToValueAtTime(kind === "pad" ? 800 : 900, t + dur);
  const atk = kind === "pad" ? 0.18 : 0.01;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vel * (kind === "pad" ? 0.22 : 0.18), t + atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f);
  o2.connect(f);
  f.connect(g);
  g.connect(dest);
  o.start(t);
  o2.start(t);
  o.stop(t + dur + 0.02);
  o2.stop(t + dur + 0.02);
}

function playChord(ctx, dest, t, notes, dur, vel) {
  for (const n of notes) playVoice(ctx, dest, t, n, dur, vel, "pad");
}

function makeDelay(ctx, dest, mix) {
  const dry = ctx.createGain();
  const wet = ctx.createGain();
  const d = ctx.createDelay(1);
  const fb = ctx.createGain();
  const f = ctx.createBiquadFilter();
  d.delayTime.value = 0.28;
  fb.gain.value = 0.32;
  wet.gain.value = mix;
  dry.gain.value = 1;
  f.type = "lowpass";
  f.frequency.value = 2400;
  dry.connect(dest);
  wet.connect(dest);
  d.connect(f);
  f.connect(fb);
  fb.connect(d);
  f.connect(wet);
  const input = ctx.createGain();
  input.connect(dry);
  input.connect(d);
  return input;
}

function scheduleTrack(ctx, dest, track, when, offset = 0, playFor = Infinity) {
  const total = trackDuration(track);
  const bus = ctx.createGain();
  const delayed = makeDelay(ctx, dest, track.fx?.delay || 0);
  bus.connect(delayed);

  const six = 60 / track.bpm / 4;
  const startStep = Math.floor(offset / six);
  const endTime = offset + playFor;

  const drums = track.drums || {};
  for (const [name, pattern] of Object.entries(drums)) {
    const p = pat(pattern);
    if (!p.length) continue;
    for (let bar = 0; bar < track.bars; bar++) {
      for (let s = 0; s < 16; s++) {
        const vel = p[s % p.length];
        if (!vel) continue;
        const st = stepTime(track, bar, s);
        if (st + 0.001 < offset || st > endTime) continue;
        const t = when + (st - offset);
        if (name === "kick") hitKick(ctx, bus, t, vel);
        else if (name === "snare") hitSnare(ctx, bus, t, vel);
        else if (name === "hat") hitHat(ctx, bus, t, vel * 0.7, false);
        else if (name === "clap") hitClap(ctx, bus, t, vel);
        else hitPerc(ctx, bus, t, vel);
      }
    }
  }

  for (const [b, s, midi, len, vel] of track.bass || []) {
    const st = stepTime(track, b, s);
    const dur = len * six;
    if (st + dur < offset || st > endTime) continue;
    const t = when + Math.max(0, st - offset);
    const cut = st < offset ? dur - (offset - st) : dur;
    if (cut > 0.02) playBass(ctx, bus, t, midi, cut, vel, !!track.fx?.log);
  }
  for (const [b, s, notes, len, vel] of track.pad || []) {
    const st = stepTime(track, b, s);
    const dur = len * six;
    if (st + dur < offset || st > endTime) continue;
    const t = when + Math.max(0, st - offset);
    const cut = st < offset ? dur - (offset - st) : dur;
    if (cut > 0.02) playChord(ctx, bus, t, notes, cut, vel);
  }
  for (const [b, s, midi, len, vel] of track.lead || []) {
    const st = stepTime(track, b, s);
    const dur = len * six;
    if (st + dur < offset || st > endTime) continue;
    const t = when + Math.max(0, st - offset);
    const cut = st < offset ? dur - (offset - st) : dur;
    if (cut > 0.02) playVoice(ctx, bus, t, midi, cut, vel, "lead");
  }

  if (track.fx?.vinyl) {
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer(ctx, 2);
    src.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = "bandpass";
    f.frequency.value = 2400;
    const g = ctx.createGain();
    g.gain.value = track.fx.vinyl * 0.08;
    src.connect(f);
    f.connect(g);
    g.connect(dest);
    src.start(when);
    const stopAt = when + Math.min(playFor, total - offset) + 0.05;
    src.stop(stopAt);
  }

  return { total, stopAt: when + Math.min(playFor, Math.max(0.05, total - offset)) };
}

async function renderTrack(track, bars = track.bars) {
  const seconds = (bars * 4 * 60) / track.bpm;
  const ctx = new OfflineAudioContext(2, Math.ceil(44100 * seconds), 44100);
  const master = ctx.createGain();
  master.gain.value = 0.9;
  master.connect(ctx.destination);
  const sliced = { ...track, bars };
  scheduleTrack(ctx, master, sliced, 0, 0, seconds);
  return ctx.startRendering();
}

function playTrackLive(ctx, dest, track, offset = 0) {
  const g = ctx.createGain();
  g.connect(dest);
  const info = scheduleTrack(ctx, g, track, ctx.currentTime + 0.03, offset, trackDuration(track));
  return { gain: g, ...info };
}

function renderWhoosh(ctx) {
  const t = 0.02;
  hitNoise(ctx, ctx.destination, t, 1, 0.45, 400, 0.5);
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = "sawtooth";
  o.frequency.setValueAtTime(200, t);
  o.frequency.exponentialRampToValueAtTime(1400, t + 0.4);
  g.gain.setValueAtTime(0.12, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
  o.connect(g);
  g.connect(ctx.destination);
  o.start(t);
  o.stop(t + 0.46);
}

function renderImpact(ctx) {
  hitKick(ctx, ctx.destination, 0.01, 1);
  hitNoise(ctx, ctx.destination, 0.01, 0.8, 0.4, 200, 0.6);
}

function renderPop(ctx) {
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(880, 0.01);
  o.frequency.exponentialRampToValueAtTime(220, 0.12);
  g.gain.setValueAtTime(0.5, 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, 0.14);
  o.connect(g);
  g.connect(ctx.destination);
  o.start(0.01);
  o.stop(0.15);
}

function renderRiser(ctx) {
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = "sawtooth";
  o.frequency.setValueAtTime(80, 0.01);
  o.frequency.exponentialRampToValueAtTime(900, 1.4);
  g.gain.setValueAtTime(0.02, 0.01);
  g.gain.linearRampToValueAtTime(0.22, 1.35);
  g.gain.exponentialRampToValueAtTime(0.0001, 1.5);
  o.connect(g);
  g.connect(ctx.destination);
  o.start(0.01);
  o.stop(1.52);
}

function renderClick(ctx) {
  hitNoise(ctx, ctx.destination, 0.01, 0.8, 0.04, 4000, 0.5);
}

function renderReverse(ctx) {
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.frequency.setValueAtTime(200, 0.01);
  o.frequency.exponentialRampToValueAtTime(80, 0.7);
  g.gain.setValueAtTime(0.01, 0.01);
  g.gain.linearRampToValueAtTime(0.35, 0.62);
  g.gain.exponentialRampToValueAtTime(0.0001, 0.75);
  o.connect(g);
  g.connect(ctx.destination);
  o.start(0.01);
  o.stop(0.76);
}

const SFX_RENDER = {
  whoosh: [renderWhoosh, 0.5],
  impact: [renderImpact, 0.5],
  pop: [renderPop, 0.2],
  riser: [renderRiser, 1.55],
  click: [renderClick, 0.08],
  reverse: [renderReverse, 0.8],
};

async function renderSfx(id) {
  const pair = SFX_RENDER[id];
  if (!pair) return null;
  const [fn, sec] = pair;
  const ctx = new OfflineAudioContext(1, Math.ceil(44100 * sec), 44100);
  fn(ctx);
  return ctx.startRendering();
}


function detectBeats(buffer) {
  const data = buffer.getChannelData(0);
  const sr = buffer.sampleRate;
  const hop = 512;
  const env = [];
  for (let i = 0; i < data.length; i += hop) {
    let s = 0;
    const end = Math.min(data.length, i + hop);
    for (let j = i; j < end; j++) s += data[j] * data[j];
    env.push(Math.sqrt(s / (end - i || 1)));
  }
  const flux = [0];
  for (let i = 1; i < env.length; i++) flux.push(Math.max(0, env[i] - env[i - 1]));
  let sum = 0;
  for (const v of flux) sum += v;
  const avg = sum / (flux.length || 1);
  const beats = [];
  let last = -999;
  const minGap = Math.round((0.27 * sr) / hop);
  for (let i = 0; i < flux.length; i++) {
    if (flux[i] > avg * 1.55 && i - last > minGap) {
      beats.push((i * hop) / sr);
      last = i;
    }
  }
  return beats;
}

function encodeWav(buffer) {
  const ch = buffer.numberOfChannels;
  const sr = buffer.sampleRate;
  const n = buffer.length;
  const bytes = n * ch * 2;
  const out = new ArrayBuffer(44 + bytes);
  const v = new DataView(out);
  const w = (o, s) => {
    for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i));
  };
  w(0, "RIFF");
  v.setUint32(4, 36 + bytes, true);
  w(8, "WAVE");
  w(12, "fmt ");
  v.setUint32(16, 16, true);
  v.setUint16(20, 1, true);
  v.setUint16(22, ch, true);
  v.setUint32(24, sr, true);
  v.setUint32(28, sr * ch * 2, true);
  v.setUint16(32, ch * 2, true);
  v.setUint16(34, 16, true);
  w(36, "data");
  v.setUint32(40, bytes, true);
  const chans = [];
  for (let c = 0; c < ch; c++) chans.push(buffer.getChannelData(c));
  let o = 44;
  for (let i = 0; i < n; i++) {
    for (let c = 0; c < ch; c++) {
      const s = Math.max(-1, Math.min(1, chans[c][i]));
      v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      o += 2;
    }
  }
  return new Blob([out], { type: "audio/wav" });
}

const APP = "TAKT";
const HOSTS = [
  "https://api.audius.co",

const SONG_GENRES = [
  "For you",
  "Trap",
  "Drill",
  "House",

  "Amapiano",
  "Phonk",
  "Pop",
  "R&B",

];

const GENRE_QUERY = {
  Trap: "trap beat",
  Drill: "drill beat",
  House: "house music",
  "Lo-fi": "lofi beats",
  Amapiano: "amapiano",
  Phonk: "phonk",
  Pop: "pop",
  "R&B": "rnb soul",
  Rap: "rap hip hop",
  EDM: "edm dance",
  Afro: "afrobeats",
};

async function getJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error("audius " + r.status);
  return r.json();
}

function normalize(t) {
  const art = t.artwork || {};
  return {
    id: "au_" + t.id,
    audiusId: t.id,
    title: t.title || "Untitled",
    artist: (t.user && (t.user.name || t.user.handle)) || "Artist",
    duration: t.duration || 30,
    genre: t.genre || "",
    mood: t.mood || "",
    art: art["150x150"] || art["480x480"] || "",
    color: "#3dffc4",
    streamUrl: `https://discoveryprovider.audius.co/v1/tracks/${t.id}/stream?app_name=${APP}`,
  };
}

async function searchSongs(query, genre = "For you") {
  const q = (query || "").trim() || (genre !== "For you" ? GENRE_QUERY[genre] || genre : "");
  const path = q
    ? `/v1/tracks/search?query=${encodeURIComponent(q)}&limit=24&app_name=${APP}`
    : `/v1/tracks/trending?limit=24&app_name=${APP}`;
  let lastErr;
  for (const host of HOSTS) {
    try {
      const data = await getJson(host + path);
      const list = (data.data || []).map(normalize);
      if (list.length) return list;
    } catch (e) {
      lastErr = e;
    }
  }
  if (lastErr) throw lastErr;
  return [];
}

async function fetchSongBlob(audiusId) {
  const urls = [
    `https://discoveryprovider.audius.co/v1/tracks/${audiusId}/stream?app_name=${APP}`,
    `https://api.audius.co/v1/tracks/${audiusId}/stream?app_name=${APP}`,
  ];
  for (const u of urls) {
    try {
      const r = await fetch(u);
      if (!r.ok) continue;
      const blob = await r.blob();
      if (blob && blob.size > 8000) {
        const type = blob.type && blob.type.startsWith("audio") ? blob.type : "audio/mpeg";
        return blob.slice(0, blob.size, type);
      }
    } catch {}
  }
  throw new Error("Could not pull that song");
}


/* ---- engine.js ---- */


import {
  detectBeats,
  getTrack,
  renderSfx,
  renderTrack,
  trackBeats,
} from "./library.js";

const FILTERS = {
  none: "",
  vivid: "contrast(1.18) saturate(1.35)",
  cine: "contrast(1.12) saturate(0.82) sepia(0.12)",
  fade: "contrast(0.9) saturate(0.75) brightness(1.08)",
  noir: "grayscale(1) contrast(1.2)",
  polaroid: "sepia(0.35) contrast(1.05) saturate(0.9) brightness(1.08)",
  tokyo: "saturate(1.25) hue-rotate(-12deg) contrast(1.1)",
  miami: "saturate(1.4) hue-rotate(18deg) contrast(1.08)",
  golden: "sepia(0.28) saturate(1.2) brightness(1.06) contrast(1.05)",
  arctic: "saturate(0.7) contrast(1.1) brightness(1.08) hue-rotate(12deg)",
  punch: "contrast(1.28) saturate(1.2)",
  dream: "blur(0.4px) brightness(1.1) saturate(1.15) contrast(0.95)",
  retro: "sepia(0.45) contrast(1.15) saturate(1.3)",
  matrix: "hue-rotate(80deg) saturate(1.4) contrast(1.15)",
  blush: "saturate(1.15) contrast(1.05) hue-rotate(-18deg) brightness(1.05)",
};

const FILTER_IDS = Object.keys(FILTERS);

function wait(el, ev) {
  return new Promise((res) => el.addEventListener(ev, res, { once: true }));
}

function cssFilter(clip) {
  const a = clip.adjust || {};
  const parts = [FILTERS[clip.filter] || ""];
  if (a.brightness) parts.push(`brightness(${1 + a.brightness / 100})`);
  if (a.contrast) parts.push(`contrast(${1 + a.contrast / 100})`);
  if (a.saturate) parts.push(`saturate(${1 + a.saturate / 100})`);
  if (a.warmth) parts.push(`sepia(${Math.max(0, a.warmth) / 200}) hue-rotate(${-a.warmth * 0.35}deg)`);
  return parts.filter(Boolean).join(" ") || "none";
}

class Engine {
  constructor(store, db) {
    this.store = store;
    this.db = db;
    this.canvas = null;
    this.ctx = null;
    this.stage = null;
    this.pool = [];
    this.assign = new Map();
    this.media = new Map();
    this.urls = new Map();
    this.images = new Map();
    this.audioBuf = new Map();
    this.audioCtx = null;
    this.master = null;
    this.musicGain = null;
    this.voiceGain = null;
    this.clipGain = null;
    this.liveNodes = [];
    this.raf = 0;
    this.originPerf = 0;
    this.originTime = 0;
    this.exporting = false;
    this.onFrame = null;
  }

  attach(stage, canvas) {
    this.stage = stage;
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d", { alpha: false });
    this.pool = [];
    for (let i = 0; i < 3; i++) {
      const v = document.createElement("video");
      v.playsInline = true;
      v.muted = true;
      v.preload = "auto";
      v.className = "pool";
      stage.appendChild(v);
      this.pool.push(v);
    }
    this.resize();
    this.draw(this.store.time);
  }

  resize() {
    if (!this.canvas || !this.store.project) return;
    const [w, h] = RATIOS[this.store.project.ratio] || RATIOS["9:16"];
    const wrap = this.stage.parentElement;
    const maxW = wrap.clientWidth - 8;
    const maxH = wrap.clientHeight - 8;
    const scale = Math.min(maxW / w, maxH / h, 1);
    const cw = Math.max(2, Math.round(w * scale));
    const ch = Math.max(2, Math.round(h * scale));
    this.canvas.style.width = cw + "px";
    this.canvas.style.height = ch + "px";
    this.stage.style.width = cw + "px";
    this.stage.style.height = ch + "px";
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.canvas.width = Math.round(cw * dpr);
    this.canvas.height = Math.round(ch * dpr);
    this.draw(this.now());
  }

  async unlock() {
    if (!this.audioCtx) {
      this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.audioCtx.createGain();
      this.master.gain.value = 1;
      this.master.connect(this.audioCtx.destination);
      this.musicGain = this.audioCtx.createGain();
      this.voiceGain = this.audioCtx.createGain();
      this.clipGain = this.audioCtx.createGain();
      this.musicGain.connect(this.master);
      this.voiceGain.connect(this.master);
      this.clipGain.connect(this.master);
    }
    if (this.audioCtx.state === "suspended") await this.audioCtx.resume();
  }

  async cacheMedia(id) {
    if (this.media.has(id)) return this.media.get(id);
    const rec = await this.db.getMedia(id);
    if (!rec) return null;
    if (!this.urls.has(id)) this.urls.set(id, URL.createObjectURL(rec.blob));
    this.media.set(id, rec);
    if (rec.type === "image" && !this.images.has(id)) {
      const img = new Image();
      img.src = this.urls.get(id);
      await img.decode().catch(() => {});
      this.images.set(id, img);
    }
    return rec;
  }

  async ensureClipMedia() {
    const p = this.store.project;
    if (!p) return;
    for (const c of p.clips) await this.cacheMedia(c.mediaId);
    for (const a of [...p.music, ...p.voice]) {
      if (a.mediaId) await this.cacheMedia(a.mediaId);
    }
  }

  async getAudioBuffer(key, factory) {
    if (this.audioBuf.has(key)) return this.audioBuf.get(key);
    const buf = await factory();
    if (buf) this.audioBuf.set(key, buf);
    return buf;
  }

  async bufferForMusic(item) {
    if (item.trackId) {
      const track = getTrack(item.trackId);
      if (!track) return null;
      return this.getAudioBuffer("t:" + track.id, () => renderTrack(track));
    }
    if (item.sfxId) {
      return this.getAudioBuffer("s:" + item.sfxId, () => renderSfx(item.sfxId));
    }
    if (item.mediaId) {
      return this.getAudioBuffer("m:" + item.mediaId, async () => {
        const rec = await this.cacheMedia(item.mediaId);
        if (!rec) return null;
        const raw = await rec.blob.arrayBuffer();
        return this.audioCtx.decodeAudioData(raw.slice(0));
      });
    }
    if (item.streamUrl) {
      return this.getAudioBuffer("u:" + item.streamUrl, async () => {
        const r = await fetch(item.streamUrl);
        const raw = await r.arrayBuffer();
        return this.audioCtx.decodeAudioData(raw.slice(0));
      });
    }
    return null;
  }

  now() {
    if (!this.store.playing) return this.store.time;
    const t = this.originTime + (performance.now() - this.originPerf) / 1000;
    const d = projectDuration(this.store.project);
    if (t >= d) {
      this.pause();
      this.store.setTime(d);
      return d;
    }
    return t;
  }

  clipsAt(t) {
    return this.store.project.clips.filter((c) => t >= c.start - 0.0001 && t < clipEnd(c) + 0.0001);
  }

  sourceTime(clip, t) {
    const local = (t - clip.start) * (clip.speed || 1);
    if (clip.reverse) return clip.outPoint - local;
    return clip.inPoint + local;
  }

  async syncVideos(t) {
    const active = this.clipsAt(t).filter((c) => c.type === "video");
    const keep = new Set(active.map((c) => c.id));
    for (const [id, el] of [...this.assign.entries()]) {
      if (!keep.has(id)) {
        el.pause();
        this.assign.delete(id);
      }
    }
    for (const clip of active) {
      let el = this.assign.get(clip.id);
      if (!el) {
        el = this.pool.find((v) => ![...this.assign.values()].includes(v));
        if (!el) continue;
        const rec = await this.cacheMedia(clip.mediaId);
        if (!rec) continue;
        const url = this.urls.get(clip.mediaId);
        if (el.src !== url) {
          el.src = url;
          await wait(el, "loadeddata").catch(() => {});
        }
        this.assign.set(clip.id, el);
      }
      const want = this.sourceTime(clip, t);
      if (Number.isFinite(want) && Math.abs((el.currentTime || 0) - want) > 0.12) {
        try {
          el.currentTime = Math.max(0, want);
        } catch {}
      }
      el.playbackRate = Math.min(16, Math.max(0.25, clip.speed || 1));
      el.muted = false;
      if (this.audioCtx) {
        if (!el._taktSrc) {
          try {
            el._taktSrc = this.audioCtx.createMediaElementSource(el);
            el._taktGain = this.audioCtx.createGain();
            el._taktSrc.connect(el._taktGain);
            el._taktGain.connect(this.clipGain);
          } catch {}
        }
        if (el._taktGain) el._taktGain.gain.value = clip.muted ? 0 : clip.volume ?? 1;
      }
      if (this.store.playing && el.paused) el.play().catch(() => {});
      if (!this.store.playing && !el.paused) el.pause();
    }
  }

  coverDraw(srcW, srcH, dx, dy, dw, dh) {
    const ir = srcW / srcH;
    const or = dw / dh;
    let sw = srcW, sh = srcH, sx = 0, sy = 0;
    if (ir > or) {
      sw = srcH * or;
      sx = (srcW - sw) / 2;
    } else {
      sh = srcW / or;
      sy = (srcH - sh) / 2;
    }
    this.ctx.drawImage(srcW ? arguments[6] : null, sx, sy, sw, sh, dx, dy, dw, dh);
  }

  drawMedia(clip, alpha, t) {
    const ctx = this.ctx;
    const W = this.canvas.width;
    const H = this.canvas.height;
    const tr = clip.transform || { x: 0, y: 0, scale: 1, rotate: 0 };
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.filter = cssFilter(clip);
    ctx.translate(W / 2 + tr.x * W, H / 2 + tr.y * H);
    ctx.rotate(((tr.rotate || 0) * Math.PI) / 180);
    ctx.scale((tr.flipH ? -1 : 1) * (tr.scale || 1), (tr.flipV ? -1 : 1) * (tr.scale || 1));
    ctx.translate(-W / 2, -H / 2);

    if (clip.type === "video") {
      const el = this.assign.get(clip.id);
      if (el && el.readyState >= 2) {
        const ir = el.videoWidth / el.videoHeight || 16 / 9;
        const or = W / H;
        let dw = W, dh = H, dx = 0, dy = 0;
        if (ir > or) {
          dh = W / ir;
          dy = (H - dh) / 2;
        } else {
          dw = H * ir;
          dx = (W - dw) / 2;
        }
        ctx.drawImage(el, dx, dy, dw, dh);
      }
    } else {
      const img = this.images.get(clip.mediaId);
      if (img && img.naturalWidth) {
        const ken = 1 + 0.06 * ((t - clip.start) / clipLen(clip));
        const ir = img.naturalWidth / img.naturalHeight;
        const or = W / H;
        let dw = W * ken, dh = H * ken, dx = (W - dw) / 2, dy = (H - dh) / 2;
        if (ir > or) {
          dh = dw / ir;
          dy = (H - dh) / 2;
        } else {
          dw = dh * ir;
          dx = (W - dw) / 2;
        }
        ctx.drawImage(img, dx, dy, dw, dh);
      }
    }
    ctx.restore();

    const a = clip.adjust || {};
    if (a.vignette) {
      const g = ctx.createRadialGradient(W / 2, H / 2, W * 0.2, W / 2, H / 2, W * 0.72);
      g.addColorStop(0, "rgba(0,0,0,0)");
      g.addColorStop(1, `rgba(0,0,0,${Math.min(0.85, a.vignette / 100)})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
    if (a.fade) {
      ctx.fillStyle = `rgba(255,255,255,${Math.min(0.55, a.fade / 180)})`;
      ctx.fillRect(0, 0, W, H);
    }
    if (a.grain) {
      ctx.save();
      ctx.globalAlpha = Math.min(0.28, a.grain / 250);
      ctx.fillStyle = "#888";
      for (let i = 0; i < 80; i++) {
        ctx.fillRect(Math.random() * W, Math.random() * H, 1.2, 1.2);
      }
      ctx.restore();
    }
  }

  drawOverlays(t) {
    const ctx = this.ctx;
    const W = this.canvas.width;
    const H = this.canvas.height;
    for (const o of this.store.project.overlays) {
      if (t < o.start || t >= o.start + o.duration) continue;
      const x = o.x * W;
      const y = o.y * H;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(((o.rotate || 0) * Math.PI) / 180);
      ctx.scale(o.scale || 1, o.scale || 1);
      if (o.type === "sticker") {
        ctx.font = `${Math.round(W * 0.12)}px "Segoe UI Emoji", sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(o.emoji || "★", 0, 0);
      } else {
        this.drawText(o, W);
      }
      ctx.restore();
    }
  }

  drawText(o, W) {
    const ctx = this.ctx;
    const size = Math.round(W * 0.062);
    const text = o.text || "";
    const style = o.style || "classic";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `800 ${size}px ${style === "poster" ? "Syne, Impact, sans-serif" : "Manrope, sans-serif"}`;
    if (style === "outline") {
      ctx.lineWidth = size * 0.14;
      ctx.strokeStyle = "#000";
      ctx.fillStyle = "#fff";
      ctx.strokeText(text, 0, 0);
      ctx.fillText(text, 0, 0);
    } else if (style === "box") {
      const m = ctx.measureText(text);
      const pad = size * 0.28;
      ctx.fillStyle = "#fff";
      ctx.fillRect(-m.width / 2 - pad, -size * 0.7, m.width + pad * 2, size * 1.3);
      ctx.fillStyle = "#111";
      ctx.fillText(text, 0, 0);
    } else if (style === "neon") {
      ctx.shadowColor = "#3dffc4";
      ctx.shadowBlur = 18;
      ctx.fillStyle = "#ecfff8";
      ctx.fillText(text, 0, 0);
    } else if (style === "karaoke") {
      const m = ctx.measureText(text);
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(-m.width / 2 - 12, -size * 0.7, m.width + 24, size * 1.3);
      ctx.fillStyle = "#3dffc4";
      ctx.fillText(text, 0, 0);
    } else if (style === "poster") {
      ctx.lineWidth = size * 0.1;
      ctx.strokeStyle = "#ff2d6a";
      ctx.fillStyle = "#fff";
      ctx.strokeText(text.toUpperCase(), 0, 0);
      ctx.fillText(text.toUpperCase(), 0, 0);
    } else if (style === "typewriter") {
      ctx.fillStyle = "#fff";
      ctx.font = `600 ${size}px ui-monospace, monospace`;
      ctx.fillText(text, 0, 0);
    } else {
      ctx.shadowColor = "rgba(0,0,0,0.7)";
      ctx.shadowBlur = 8;
      ctx.fillStyle = "#fff";
      ctx.fillText(text, 0, 0);
    }
  }

  transitionAlpha(clip, t) {
    const tr = clip.transitionIn || { type: "none", duration: 0 };
    if (!tr.type || tr.type === "none") return { a: 1, mode: "cut" };
    const d = Math.max(0.01, tr.duration || 0.3);
    const u = Math.max(0, Math.min(1, (t - clip.start) / d));
    return { a: u, mode: tr.type, u };
  }

  draw(t) {
    if (!this.canvas || !this.store.project) return;
    const ctx = this.ctx;
    const W = this.canvas.width;
    const H = this.canvas.height;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = this.store.project.bg || "#000";
    ctx.fillRect(0, 0, W, H);
    const clips = this.clipsAt(t).sort((a, b) => a.start - b.start);
    if (!clips.length) {
      ctx.fillStyle = "rgba(255,255,255,0.08)";
      ctx.font = `600 ${Math.round(W * 0.045)}px Manrope, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("Add clips to start", W / 2, H / 2);
    } else if (clips.length === 1) {
      const tr = this.transitionAlpha(clips[0], t);
      this.drawMedia(clips[0], 1, t);
      if (tr.mode === "flash" && tr.u < 1) {
        ctx.fillStyle = `rgba(255,255,255,${1 - tr.u})`;
        ctx.fillRect(0, 0, W, H);
      }
    } else {
      const top = clips[clips.length - 1];
      const under = clips[clips.length - 2];
      const tr = this.transitionAlpha(top, t);
      if (tr.mode === "fade" || tr.mode === "dissolve") {
        this.drawMedia(under, 1, t);
        this.drawMedia(top, tr.a, t);
      } else if (tr.mode === "flash") {
        this.drawMedia(tr.u < 0.5 ? under : top, 1, t);
        ctx.fillStyle = `rgba(255,255,255,${1 - Math.abs(tr.u * 2 - 1)})`;
        ctx.fillRect(0, 0, W, H);
      } else {
        this.drawMedia(top, 1, t);
      }
    }
    this.drawOverlays(t);
    if (this.onFrame) this.onFrame(t);
  }

  async tick() {
    const t = this.now();
    if (this.store.playing) this.store.time = t;
    await this.syncVideos(t);
    this.draw(t);
    if (this.store.playing || this.exporting) this.raf = requestAnimationFrame(() => this.tick());
  }

  stopAudio() {
    for (const n of this.liveNodes) {
      try {
        n.stop?.();
      } catch {}
      try {
        n.disconnect?.();
      } catch {}
    }
    this.liveNodes = [];
  }

  async startAudio(from) {
    await this.unlock();
    this.stopAudio();
    const p = this.store.project;
    const ctx = this.audioCtx;
    this.clipGain.gain.value = 1;

    for (const item of p.music) {
      if (from >= item.start + item.duration || from < item.start && false) {
        /* continue below */
      }
      if (from >= item.start + item.duration) continue;
      const when = ctx.currentTime + Math.max(0, item.start - from);
      const offset = Math.max(0, from - item.start) + (item.inPoint || 0);
      const remain = item.duration - Math.max(0, from - item.start);
      if (remain <= 0.02) continue;

      const buf = await this.bufferForMusic(item);
      if (!buf) continue;
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.loop = !!item.loop || (item.trackId && remain > buf.duration - 0.05);
      const g = ctx.createGain();
      g.gain.value = item.volume ?? 0.85;
      const fadeIn = item.fadeIn || 0;
      const fadeOut = item.fadeOut || 0;
      const startG = when;
      g.gain.setValueAtTime(fadeIn ? 0.0001 : g.gain.value, startG);
      if (fadeIn) g.gain.linearRampToValueAtTime(item.volume ?? 0.85, startG + fadeIn);
      src.connect(g);
      g.connect(this.musicGain);
      try {
        src.start(when, Math.min(offset, Math.max(0, buf.duration - 0.01)), remain);
      } catch {
        src.start(when);
      }
      this.liveNodes.push(src, g);
    }

    for (const item of p.voice) {
      if (from >= item.start + item.duration) continue;
      const when = ctx.currentTime + Math.max(0, item.start - from);
      const offset = Math.max(0, from - item.start) + (item.inPoint || 0);
      const remain = item.duration - Math.max(0, from - item.start);
      const buf = await this.bufferForMusic(item);
      if (!buf) continue;
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const g = ctx.createGain();
      g.gain.value = item.volume ?? 1;
      src.connect(g);
      g.connect(this.voiceGain);
      try {
        src.start(when, Math.min(offset, Math.max(0, buf.duration - 0.01)), remain);
      } catch {
        src.start(when);
      }
      this.liveNodes.push(src, g);
    }

    const duck = p.duckOriginal ?? 0.22;
    const hasMusic = p.music.some((m) => from < m.start + m.duration && from + 0.05 > m.start - 99);
    this.clipGain.gain.value = p.music.length && hasMusic ? duck : 1;
  }

  async play() {
    if (!this.store.project) return;
    await this.ensureClipMedia();
    await this.unlock();
    const d = projectDuration(this.store.project);
    if (this.store.time >= d - 0.05) this.store.time = 0;
    this.originTime = this.store.time;
    this.originPerf = performance.now();
    this.store.playing = true;
    this.store.emit("play");
    await this.startAudio(this.store.time);
    cancelAnimationFrame(this.raf);
    this.tick();
  }

  pause() {
    this.store.time = this.now();
    this.store.playing = false;
    this.stopAudio();
    for (const el of this.pool) el.pause();
    this.store.emit("pause");
    this.draw(this.store.time);
  }

  toggle() {
    if (this.store.playing) this.pause();
    else this.play();
  }

  async seek(t) {
    const playing = this.store.playing;
    if (playing) this.pause();
    this.store.setTime(t);
    await this.syncVideos(this.store.time);
    this.draw(this.store.time);
    if (playing) this.play();
  }

  async analyzeMusicBeats() {
    const item = this.store.project.music[0];
    if (!item) {
      this.store.beats = [];
      return [];
    }
    if (item.trackId) {
      const track = getTrack(item.trackId);
      const beats = trackBeats(track).map((b) => b + item.start - (item.inPoint || 0));
      this.store.beats = beats.filter((b) => b >= item.start && b <= item.start + item.duration);
      return this.store.beats;
    }
    const buf = await this.bufferForMusic(item);
    if (!buf) return [];
    const beats = detectBeats(buf).map((b) => b + item.start - (item.inPoint || 0));
    this.store.beats = beats.filter((b) => b >= 0);
    return this.store.beats;
  }

  pickMime() {
    const types = [
      "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
      "video/mp4",
      "video/webm;codecs=vp9,opus",
      "video/webm;codecs=vp8,opus",
      "video/webm",
    ];
    for (const t of types) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
    }
    return "video/webm";
  }

  async export({ quality = 720, onProgress } = {}) {
    const p = this.store.project;
    const [bw, bh] = RATIOS[p.ratio] || RATIOS["9:16"];
    const scale = quality >= 1080 ? 1 : quality / Math.max(bw, bh);
    const w = Math.round(bw * scale) & ~1;
    const h = Math.round(bh * scale) & ~1;
    const was = this.store.playing;
    if (was) this.pause();

    const prevW = this.canvas.width;
    const prevH = this.canvas.height;
    this.canvas.width = w;
    this.canvas.height = h;
    this.exporting = true;

    await this.ensureClipMedia();
    await this.unlock();
    await this.seek(0);

    const fps = p.fps || 30;
    const duration = projectDuration(p);
    const dest = this.audioCtx.createMediaStreamDestination();
    this.master.connect(dest);

    const vstream = this.canvas.captureStream(fps);
    const mixed = new MediaStream([
      ...vstream.getVideoTracks(),
      ...dest.stream.getAudioTracks(),
    ]);
    const mime = this.pickMime();
    const rec = new MediaRecorder(mixed, {
      mimeType: mime,
      videoBitsPerSecond: quality >= 1080 ? 10_000_000 : 6_000_000,
      audioBitsPerSecond: 192000,
    });
    const chunks = [];
    rec.ondataavailable = (e) => {
      if (e.data && e.data.size) chunks.push(e.data);
    };
    const done = new Promise((res) => {
      rec.onstop = () => res(new Blob(chunks, { type: mime.includes("mp4") ? "video/mp4" : "video/webm" }));
    });
    rec.start(200);
    await this.play();
    const start = performance.now();
    await new Promise((resolve) => {
      const check = () => {
        const t = this.now();
        if (onProgress) onProgress(Math.min(1, t / duration));
        if (!this.store.playing || t >= duration - 0.03 || performance.now() - start > duration * 1000 + 4000) {
          resolve();
          return;
        }
        requestAnimationFrame(check);
      };
      check();
    });
    this.pause();
    await new Promise((r) => setTimeout(r, 180));
    rec.stop();
    const blob = await done;
    try {
      this.master.disconnect(dest);
    } catch {}
    this.exporting = false;
    this.canvas.width = prevW;
    this.canvas.height = prevH;
    this.resize();
    this.draw(this.store.time);
    if (onProgress) onProgress(1);
    const ext = blob.type.includes("mp4") ? "mp4" : "webm";
    return { blob, ext, mime: blob.type };
  }
}

async function importMediaFile(db, file) {
  if (file.type.startsWith("audio/")) {
    const url = URL.createObjectURL(file);
    const audio = new Audio();
    audio.src = url;
    await Promise.race([wait(audio, "loadedmetadata"), new Promise((r) => setTimeout(r, 4000))]);
    const rec = {
      id: "media_" + Math.random().toString(36).slice(2, 10),
      type: "audio",
      name: file.name,
      blob: file,
      duration: audio.duration || 8,
    };
    URL.revokeObjectURL(url);
    await db.putMedia(rec);
    return rec;
  }
  if (file.type.startsWith("image/")) {
    const rec = {
      id: "media_" + Math.random().toString(36).slice(2, 10),
      type: "image",
      name: file.name,
      blob: file,
      duration: 3,
      width: 0,
      height: 0,
      thumb: "",
    };
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.src = url;
    await img.decode().catch(() => {});
    rec.width = img.naturalWidth;
    rec.height = img.naturalHeight;
    const c = document.createElement("canvas");
    c.width = 180;
    c.height = 320;
    const cx = c.getContext("2d");
    cx.fillRect(0, 0, 180, 320);
    const ir = img.naturalWidth / img.naturalHeight || 1;
    let dw = 180, dh = 180 / ir, dx = 0, dy = (320 - dh) / 2;
    if (dh < 320) {
      dh = 320;
      dw = 320 * ir;
      dx = (180 - dw) / 2;
      dy = 0;
    }
    cx.drawImage(img, dx, dy, dw, dh);
    rec.thumb = c.toDataURL("image/jpeg", 0.7);
    URL.revokeObjectURL(url);
    await db.putMedia(rec);
    return rec;
  }
  const url = URL.createObjectURL(file);
  const v = document.createElement("video");
  v.preload = "auto";
  v.muted = true;
  v.playsInline = true;
  v.src = url;
  await Promise.race([wait(v, "loadedmetadata"), new Promise((r) => setTimeout(r, 8000))]);
  const rec = {
    id: "media_" + Math.random().toString(36).slice(2, 10),
    type: "video",
    name: file.name,
    blob: file,
    duration: v.duration || 1,
    width: v.videoWidth,
    height: v.videoHeight,
    thumb: "",
  };
  try {
    v.currentTime = Math.min(0.2, (v.duration || 1) * 0.1);
    await Promise.race([wait(v, "seeked"), new Promise((r) => setTimeout(r, 1500))]);
    const c = document.createElement("canvas");
    c.width = 180;
    c.height = 320;
    const cx = c.getContext("2d");
    cx.fillStyle = "#000";
    cx.fillRect(0, 0, 180, 320);
    cx.drawImage(v, 0, 0, 180, 320);
    rec.thumb = c.toDataURL("image/jpeg", 0.7);
  } catch {}
  URL.revokeObjectURL(url);
  await db.putMedia(rec);
  return rec;
}

function downloadBlob(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(a.href);
    a.remove();
  }, 4000);
}

function fmt(t) {
  t = Math.max(0, t || 0);
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  const f = Math.floor((t % 1) * 10);
  return `${m}:${String(s).padStart(2, "0")}.${f}`;
}
function ago(ts) {
  const d = Date.now() - ts;
  if (d < 60000) return "just now";
  if (d < 3600000) return Math.floor(d / 60000) + "m ago";
  if (d < 86400000) return Math.floor(d / 3600000) + "h ago";
  return new Date(ts).toLocaleDateString();
}
function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}
